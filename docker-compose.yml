services:
  app:
    build: { context: ./docker/php, dockerfile: Dockerfile }
    container_name: wms_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [wms]

  nginx:
    image: nginx:1.27-alpine
    container_name: wms_nginx
    ports: ["8000:80"]
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [wms]

  queue:
    build: { context: ./docker/php, dockerfile: Dockerfile }
    container_name: wms_queue
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [wms]

  mysql:
    image: mysql:8.4
    container_name: wms_mysql
    environment:
      MYSQL_DATABASE: wms
      MYSQL_USER: wms
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports: ["3306:3306"]
    volumes: [wms_db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [wms]

  redis:
    image: redis:7-alpine
    container_name: wms_redis
    ports: ["6379:6379"]
    networks: [wms]

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: wms_frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [nginx]
    networks: [wms]

networks:
  wms: { driver: bridge }

volumes:
  wms_db:
